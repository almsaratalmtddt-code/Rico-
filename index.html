<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مسارات ERP</title><style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#6b7280;--primary:#0f766e;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#102a43;color:#fff;padding:22px 14px}.brand{font-size:21px;font-weight:800;padding:8px 12px 22px}.brand small{display:block;color:#b8c7d9;font-size:11px;margin-top:6px}.nav button{width:100%;background:transparent;border:0;color:#dbeafe;text-align:right;padding:12px;border-radius:9px;font-size:14px;cursor:pointer}.nav button:hover,.nav button.active{background:#1d405f;color:#fff}.main{padding:26px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.title h1{margin:0;font-size:26px}.title p{margin:6px 0;color:var(--muted)}.badge{background:#dcfce7;color:#166534;padding:7px 12px;border-radius:999px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 3px 12px #00000006}.metric .label{color:var(--muted);font-size:13px}.metric .value{font-size:25px;font-weight:800;margin-top:8px}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 12px}.table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;text-align:right}.table th{background:#f8fafc;color:#475569}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--primary);color:#fff;cursor:pointer}.btn.secondary{background:#e2e8f0;color:#1e293b}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.form input,.form select{padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px}.hidden{display:none}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:2;padding:10px}.brand{padding:8px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.main{padding:15px}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px}.table{font-size:12px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">مسارات ERP<small>شركة المسارات المتعددة للاتصالات</small></div><div class="nav"><button class="active" data-page="dashboard">لوحة التحكم</button><button data-page="sales">المبيعات</button><button data-page="purchases">المشتريات</button><button data-page="customers">العملاء</button><button data-page="products">المخزون والأصناف</button><button data-page="expenses">المصروفات</button><button data-page="journal">المحاسبة والقيود</button><button data-page="reports">التقارير</button></div></aside><main class="main"><div class="top"><div class="title"><h1 id="pageTitle">لوحة التحكم</h1><p>نظام ERP مركزي للمبيعات والمحاسبة والمخزون</p></div><span class="badge">النظام جاهز للتوصيل بقاعدة بيانات أونلاين</span></div><div id="content"></div></main></div><script>
const api=async(p,o)=>{const r=await fetch(p,o);return r.json()};const money=n=>Number(n||0).toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2})+' ر.س';
const pages={dashboard:async()=>{const d=await api('/api/dashboard');return `<div class="grid"><div class="card metric"><div class="label">إجمالي المبيعات</div><div class="value">${money(d.sales)}</div></div><div class="card metric"><div class="label">إجمالي المشتريات</div><div class="value">${money(d.purchases)}</div></div><div class="card metric"><div class="label">المصروفات</div><div class="value">${money(d.expenses)}</div></div><div class="card metric"><div class="label">ذمم العملاء</div><div class="value">${money(d.receivables)}</div></div></div><div class="grid section"><div class="card"><div class="label">عدد العملاء</div><div class="value">${d.customers}</div></div><div class="card"><div class="label">الأصناف النشطة</div><div class="value">${d.products}</div></div></div><div class="card section"><h2>دورة النظام</h2><p>المبيعات والمشتريات والمصروفات والقيود مرتبطة بقاعدة بيانات ERP، مع تجهيز البنية للتوسع في الضرائب والتقارير والقوائم المالية.</p></div>`},customers:async()=>{const rows=await api('/api/customers');return `<div class="card"><div class="toolbar"><button class="btn" onclick="addCustomer()">+ عميل جديد</button></div><table class="table"><tr><th>الكود</th><th>العميل</th><th>الهاتف</th><th>الرقم الضريبي</th><th>الرصيد الافتتاحي</th></tr>${rows.map(x=>`<tr><td>${x.code||''}</td><td>${x.name}</td><td>${x.phone||''}</td><td>${x.tax_no||''}</td><td>${money(x.opening_balance)}</td></tr>`).join('')}</table></div>`},products:async()=>{const rows=await api('/api/products');return `<div class="card"><div class="toolbar"><button class="btn" onclick="addProduct()">+ صنف جديد</button></div><table class="table"><tr><th>SKU</th><th>الصنف</th><th>الوحدة</th><th>سعر البيع</th><th>الضريبة</th><th>المخزون</th></tr>${rows.map(x=>`<tr><td>${x.sku||''}</td><td>${x.name}</td><td>${x.unit}</td><td>${money(x.sale_price)}</td><td>${x.tax_rate}%</td><td>${x.stock}</td></tr>`).join('')}</table></div>`},sales:async()=>{const rows=await api('/api/invoices');const r=rows.filter(x=>x.type==='sale');return `<div class="card"><div class="toolbar"><button class="btn">+ فاتورة مبيعات</button><button class="btn secondary">تصدير</button></div><table class="table"><tr><th>رقم الفاتورة</th><th>التاريخ</th><th>العميل</th><th>الإجمالي</th><th>المدفوع</th><th>الحالة</th></tr>${r.map(x=>`<tr><td>${x.invoice_no||x.id}</td><td>${x.date}</td><td>${x.customer_name||'نقدي'}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${x.status}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا توجد فواتير بعد</td></tr>'}</table></div>`},purchases:async()=>{const rows=await api('/api/invoices');const r=rows.filter(x=>x.type==='purchase');return `<div class="card"><div class="toolbar"><button class="btn">+ فاتورة مشتريات</button></div><table class="table"><tr><th>رقم</th><th>التاريخ</th><th>الإجمالي</th><th>المدفوع</th><th>الحالة</th></tr>${r.map(x=>`<tr><td>${x.invoice_no||x.id}</td><td>${x.date}</td><td>${money(x.total)}</td><td>${money(x.paid)}</td><td>${x.status}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد فواتير بعد</td></tr>'}</table></div>`},expenses:async()=>{const rows=await api('/api/expenses');return `<div class="card"><div class="toolbar"><button class="btn" onclick="addExpense()">+ مصروف جديد</button></div><table class="table"><tr><th>التاريخ</th><th>التصنيف</th><th>الوصف</th><th>المبلغ</th><th>الضريبة</th></tr>${rows.map(x=>`<tr><td>${x.date}</td><td>${x.category}</td><td>${x.description||''}</td><td>${money(x.amount)}</td><td>${money(x.tax)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد مصروفات</td></tr>'}</table></div>`},journal:async()=>{const rows=await api('/api/journal');return `<div class="card"><table class="table"><tr><th>القيد</th><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th></tr>${rows.map(x=>`<tr><td>${x.entry_no}</td><td>${x.date}</td><td>${x.description}</td><td>${money(x.debit)}</td><td>${money(x.credit)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">لا توجد قيود</td></tr>'}</table></div>`},reports:async()=>`<div class="grid"><div class="card"><h2>التقارير المالية</h2><p>ميزان المراجعة، قائمة الدخل، المركز المالي، التدفقات النقدية.</p></div><div class="card"><h2>التقارير التشغيلية</h2><p>المبيعات، المشتريات، المخزون، الذمم، المصروفات.</p></div><div class="card"><h2>الضريبة</h2><p>تجهيز تقارير ضريبة القيمة المضافة والإقرار.</p></div><div class="card"><h2>التحليل</h2><p>مؤشرات الأداء والربحية وحركة المبيعات.</p></div></div>`};
async function render(p){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('pageTitle').textContent=document.querySelector(`[data-page="${p}"]`).textContent;document.getElementById('content').innerHTML=await pages[p]();}
async function addCustomer(){const name=prompt('اسم العميل؟');if(!name)return;const phone=prompt('الهاتف؟')||'';await api('/api/customers',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,phone})});render('customers')}
async function addProduct(){const name=prompt('اسم الصنف؟');if(!name)return;const price=prompt('سعر البيع؟')||0;await api('/api/products',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,sale_price:price})});render('products')}
async function addExpense(){const category=prompt('تصنيف المصروف؟');if(!category)return;const amount=prompt('المبلغ؟')||0;await api('/api/expenses',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({date:new Date().toISOString().slice(0,10),category,amount})});render('expenses')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));render('dashboard');
</script></body></html>
